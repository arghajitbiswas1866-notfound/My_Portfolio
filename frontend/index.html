<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Arghajit Biswas - CSE Student and Aspiring Full-Stack Developer"
    >

    <title>Arghajit Biswas | Developer</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Devicon -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
    >


    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Your CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <nav
        id="navbar"
        class="navbar navbar-expand-lg sticky-top"
    >

        <div class="container-fluid">

            <!-- Created by JS -->
            <div id="navbar-brand"></div>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >

                <span class="navbar-toggler-icon"></span>

            </button>


            <div
                class="collapse navbar-collapse"
                id="navbarMenu"
            >

                <!-- Created by JS -->
                <ul
                    id="navbar-links"
                    class="navbar-nav ms-auto"
                ></ul>

            </div>

        </div>

    </nav>



    <!-- =====================================================
         HERO
    ====================================================== -->

    <main>

        <section
            id="home"
            class="hero"
        >

            <!-- Background decoration -->

            <div class="hero-glow glow-one"></div>

            <div class="hero-glow glow-two"></div>


            <!-- =================================================
                 HERO TEXT
            ================================================== -->

            <div
                id="hero-content"
                class="hero-content"
            >

                <div class="hero-intro">
                    Hi, I am
                </div>


                <h1
                    id="hero-name"
                    class="hero-name"
                ></h1>


                <p
                    id="hero-description"
                    class="hero-description"
                ></p>


                <p
                    id="hero-subdescription"
                    class="hero-subdescription"
                ></p>


                <!-- Typing -->

                <div class="animated-role">

                    <span>I am a </span>

                    <span
                        id="changing-text"
                        class="changing-text"
                    ></span>

                </div>


                <!-- Socials created by JS -->

                <div
                    id="social-icons"
                    class="social-media-icons"
                ></div>


                <!-- CTA buttons -->

                <div
                    id="hero-buttons"
                    class="hero-buttons"
                ></div>

            </div>



            <!-- =================================================
                 DYNAMIC HERO VISUAL
            ================================================== -->

            <div
                id="hero-visual"
                class="hero-visual"
            >

                <!-- Everything inside created by JS -->

            </div>

        </section>



        <!-- =====================================================
             ABOUT
        ====================================================== -->

        <section
            id="about"
            class="about-section"
        >

            <div
                id="about-content"
                class="about-content"
            ></div>

        </section>



        <!-- =====================================================
             SKILLS
        ====================================================== -->

        <section
            id="skills"
            class="skills-section"
        >

            <div class="skills-container">


                <div class="skills-heading">

                    <span class="section-label">
                        WHAT I USE
                    </span>

                    <h2>
                        Skills
                    </h2>

                    <p>
                        Technologies I work with and continuously learn.
                    </p>

                </div>


                <!-- Filters generated by JS -->

                <div
                    id="skill-filters"
                    class="skill-filters"
                ></div>


                <!-- Skills generated by JS -->

                <div
                    id="skills-grid"
                    class="skills-grid"
                ></div>


                <!-- Currently learning -->

                <div
                    id="currently-learning"
                    class="currently-learning"
                ></div>


            </div>

        </section>

        <!-- =====================================================
     PROJECTS
====================================================== -->

<section
    id="projects"
    class="projects-section"
>

    <div class="projects-container">

        <div class="projects-heading">

            <span class="section-label">
                WHAT I BUILD
            </span>

            <h2>My Projects</h2>

            <p>
                A collection of projects I've built while
                learning and experimenting with technology.
            </p>

        </div>


        <!-- Projects will be generated by JavaScript -->

        <div
            id="projects-grid"
            class="projects-grid"
        ></div>

    </div>

</section>


    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer id="footer" style="border-radius: 10% 10% 0 0;"></footer>



    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- Your JS -->

    <script src="script.js"></script>

</body>

</html>
